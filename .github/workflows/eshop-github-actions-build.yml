name: Building EShop Projects
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ["8.0.x"]
    steps:
      - name: Checkout the Projects
        uses: actions/checkout@v4
        
      - name: List the contents of the working directory
        run: ls -la  # List files in the current directory (Unix/Linux)

      - name: Show directory structure (optional)
        run: tree  # If you want to see a tree-like structure, ensure 'tree' is installed
        
      - name: List files in the repository
        run: |
          ls -R  # List files recursively to confirm the path
          
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: ${{matrix.dotnet-version}}

      - name: Restore Packages
        run: dotnet restore ./EShopWeb/EShopWeb.sln

      - name: Build Project
        run: dotnet build ./EShopWeb/EShopWeb.sln --configuration Release --no-restore

      - name: Publish FunctionApp
        run: dotnet publish ./EShopFunctionApp/EShopFunctionApp.csproj -o ./published_EShopFunctionApp
        
      - name: Publish WebApp
        run: dotnet publish ./EShopWeb/EShopWeb.csproj -o ./published_EShopWeb
        
      - name: Show directory structure (optional)
        run: tree  # If you want to see a tree-like structure, ensure 'tree' is installed
        
      - name: List contents of the published directory
        run: ls -R ./published_EShopFunctionApp 
        
      - name: Zip published EShopFunctionApp files
        run: |
          cd ./published_EShopFunctionApp
          zip -r ./published/EShopFunctionApp.zip
      - name: Zip published EShopWeb files
        run: |
          cd ./published_EShopWeb
          zip -r ./published/EShopWeb.zip

