name: BuildingEShopProjects
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ["8.0.x"]
    steps:
      - name: Checkout the Projects
        uses: actions/checkout@v4
        
      - name: Show directory structure (optional)
        run: tree  # If you want to see a tree-like structure, ensure 'tree' is installed 
          
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5.0.0
        with:
          dotnet-version: ${{matrix.dotnet-version}}

      - name: Restore Packages
        run: dotnet restore ./EShopWeb/EShopWeb.sln

      - name: Build Project
        run: dotnet build ./EShopWeb/EShopWeb.sln --configuration Release --no-restore

      - name: Publish FunctionApp
        run: dotnet publish ./EShopFunctionApp/EShopFunctionApp.csproj --configuration Release -o ./published_EShopFunctionApp
        
      - name: Publish WebApp
        run: dotnet publish ./EShopWeb/EShopWeb.csproj --configuration Release -o ./published_EShopWeb                
                
      - name: Show directory structure (optional)
        run: tree  # If you want to see a tree-like structure, ensure 'tree' is installed
        
      - name: Upload EShopFunctionApp artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: EShopFunctionApp  # The name for the artifact
          path: ./published_EShopFunctionApp  # Path to the .zip file to upload
          
      - name: Upload EShopWeb artifact
        uses: actions/upload-artifact@v5.0.0
        with:
          name: EShopWeb  # The name for the artifact
          path: ./published_EShopWeb  # Path to the .zip file to upload     
